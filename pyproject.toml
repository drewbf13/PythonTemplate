[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-runtime-template"
version = "0.2.0"
description = "Plugin-based analytics runtime host template"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "grpcio",
  "grpcio-tools",
  "grpcio-reflection",
  "azure-identity",
  "pyodbc",
  "pydantic",
  "pydantic-settings",
]

[tool.setuptools]
packages = ["app", "analytics_runtime"]

[project.scripts]
analytics-runtime-host = "app.main:run"
