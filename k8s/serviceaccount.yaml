apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-runtime-sa
  labels:
    app: analytics-runtime
  annotations:
    # For AKS Workload Identity, set this to your user-assigned managed identity client ID.
    # azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
    azure.workload.identity/use: "true"
